name: Web E2E Tests

on:
  workflow_dispatch:

jobs:
  e2e-tests:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout do repositório
      - name: Checkout do repositório
        uses: actions/checkout@v4

      # 2. Configuração do Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      # 3. Instalação das dependências
      - name: Instalar dependências
        run: npm ci

      # 4. Limpeza dos relatórios anteriores
      - name: Limpar relatórios anteriores
        run: npm run report:clean

      # 5. Execução dos testes
      - name: Executar testes E2E
        id: cypress
        continue-on-error: true
        run: npm run test:modules

      # 6. Consolidação dos resultados
      - name: Consolidar resultados
        if: ${{ always() }}
        run: |
          if compgen -G "cypress/results/*.json" > /dev/null; then
            npm run report:merge
          else
            echo "Nenhum relatório JSON foi gerado."
          fi

      # 7. Geração do relatório HTML
      - name: Gerar relatório HTML
        if: ${{ always() }}
        run: |
          if [ -f cypress/reports-data/report.json ]; then
            npm run report:generate
          else
            echo "Relatório consolidado não encontrado."
          fi

      # 8. Publicação dos relatórios e evidências
      - name: Publicar relatórios
        uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: relatorios-mochawesome
          path: |
            cypress/reports/
            cypress/reports-data/
            cypress/results/
            cypress/screenshots/
            cypress/videos/
          if-no-files-found: warn
          retention-days: 7

      # 9. Preservar o status de falha dos testes
      - name: Verificar resultado dos testes
        if: ${{ always() && steps.cypress.outcome == 'failure' }}
        run: exit 1

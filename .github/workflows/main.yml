name: Web E2E Tests

on:
  workflow_dispatch:

jobs:
  e2e-tests:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout do repositório
      - name: Checkout do repositório
        uses: actions/checkout@v4

      # 2. Configuração do Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      # 3. Instalação das dependências
      - name: Instalar dependências
        run: npm ci
        env:
          NODE_ENV: development

      # 4. Execução de um arquivo específico de testes
      - name: Executar testes E2E
        run: npx cypress run --spec "cypress/e2e/1-getting-started/automation-exercise-modules.cy.js"

      # 5. Upload dos relatórios, screenshots e vídeos
      - name: Upload de artefatos
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: relatorios
          path: |
            cypress/reports/
            cypress/screenshots/
            cypress/videos/
          if-no-files-found: warn
          retention-days: 7
          
